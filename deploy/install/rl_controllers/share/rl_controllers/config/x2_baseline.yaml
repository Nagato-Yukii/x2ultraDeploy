controller_manager:
  ros__parameters:
    update_rate: 500  # Hz — matches training physics step (500 Hz), policy runs at 500/10=50 Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    rl_controllers:
      type: legged/AcController

rl_controllers:
  ros__parameters:
    # ── X2 Ultra 31-DoF joint list ──────────────────────────────────────────
    # Order: leg(12) → waist(3) → arm(14) → head(2)
    # Must match the URDF joint names in robot_descriptions_public/urdf/x2_ultra.urdf
    joints:
      # leg — policy-controlled (12)
      - left_hip_pitch_joint
      - left_hip_roll_joint
      - left_hip_yaw_joint
      - left_knee_joint
      - left_ankle_pitch_joint
      - left_ankle_roll_joint
      - right_hip_pitch_joint
      - right_hip_roll_joint
      - right_hip_yaw_joint
      - right_knee_joint
      - right_ankle_pitch_joint
      - right_ankle_roll_joint
      # waist — fixed at default (3)
      - waist_yaw_joint
      - waist_pitch_joint
      - waist_roll_joint
      # arm — fixed at default (14)
      - left_shoulder_pitch_joint
      - left_shoulder_roll_joint
      - left_shoulder_yaw_joint
      - left_elbow_joint
      - left_wrist_yaw_joint
      - left_wrist_pitch_joint
      - left_wrist_roll_joint
      - right_shoulder_pitch_joint
      - right_shoulder_roll_joint
      - right_shoulder_yaw_joint
      - right_elbow_joint
      - right_wrist_yaw_joint
      - right_wrist_pitch_joint
      - right_wrist_roll_joint
      # head — fixed at default (2)
      - head_yaw_joint
      - head_pitch_joint

    command_interfaces:
      - position
      - velocity
      - effort
      - Kp
      - Kd
    state_interfaces:
      - position
      - velocity
      - effort

    # ── Policy model ────────────────────────────────────────────────────────
    policyFile: policy/X2/model.onnx
    start_mode: default_stand

    LeggedRobotCfg:
      init_state:
        # Default joint angles (rad) when action = 0.0
        # Source: x2_walk_straight_sim2sim_details.txt section 7
        default_joint_angle:
          left_hip_pitch_joint:   -0.15
          left_hip_roll_joint:     0.0
          left_hip_yaw_joint:      0.0
          left_knee_joint:         0.3
          left_ankle_pitch_joint: -0.15
          left_ankle_roll_joint:   0.0
          right_hip_pitch_joint:  -0.15
          right_hip_roll_joint:    0.0
          right_hip_yaw_joint:     0.0
          right_knee_joint:        0.3
          right_ankle_pitch_joint: -0.15
          right_ankle_roll_joint:  0.0

        # Compatibility aliases for current AcController.cpp parameter paths.
        default_waist_joint_angle:
          waist_yaw_joint:   0.0
          waist_pitch_joint: 0.0
          waist_roll_joint:  0.0

        # Keep the misspelling because the current C++ code queries this exact key.
        default_wasit_joint_angle:
          waist_pitch_joint: 0.0

        default_arm_joint_angle:
          waist_yaw_joint:            0.0
          waist_pitch_joint:          0.0
          waist_roll_joint:           0.0
          left_shoulder_pitch_joint:  0.3
          left_shoulder_roll_joint:   0.2
          left_shoulder_yaw_joint:    0.0
          left_elbow_joint:          -0.9
          left_wrist_yaw_joint:       0.0
          left_wrist_pitch_joint:     0.0
          left_wrist_roll_joint:      0.0
          right_shoulder_pitch_joint: 0.3
          right_shoulder_roll_joint: -0.2
          right_shoulder_yaw_joint:   0.0
          right_elbow_joint:         -0.9
          right_wrist_yaw_joint:      0.0
          right_wrist_pitch_joint:    0.0
          right_wrist_roll_joint:     0.0
          head_yaw_joint:             0.0
          head_pitch_joint:           0.0

        default_head_joint_angle:
          head_yaw_joint:   0.0
          head_pitch_joint: 0.0

      control:
        # PD parameters — source: x2_walk_straight_sim2sim_details.txt section 7
        stiffness:
          # leg
          left_hip_pitch_joint:    200.
          left_hip_roll_joint:     200.
          left_hip_yaw_joint:      150.
          left_knee_joint:         200.
          left_ankle_pitch_joint:   60.
          left_ankle_roll_joint:    60.
          right_hip_pitch_joint:   200.
          right_hip_roll_joint:    200.
          right_hip_yaw_joint:     150.
          right_knee_joint:        200.
          right_ankle_pitch_joint:  60.
          right_ankle_roll_joint:   60.
          # waist
          waist_yaw_joint:         200.
          waist_pitch_joint:       100.
          waist_roll_joint:        100.
          # arm
          left_shoulder_pitch_joint:  40.
          left_shoulder_roll_joint:   40.
          left_shoulder_yaw_joint:    40.
          left_elbow_joint:           40.
          left_wrist_yaw_joint:       40.
          left_wrist_pitch_joint:     40.
          left_wrist_roll_joint:      40.
          right_shoulder_pitch_joint: 40.
          right_shoulder_roll_joint:  40.
          right_shoulder_yaw_joint:   40.
          right_elbow_joint:          40.
          right_wrist_yaw_joint:      40.
          right_wrist_pitch_joint:    40.
          right_wrist_roll_joint:     40.
          # head
          head_yaw_joint:   10.
          head_pitch_joint: 10.

        damping:
          # leg
          left_hip_pitch_joint:   8.
          left_hip_roll_joint:    8.
          left_hip_yaw_joint:     6.
          left_knee_joint:        8.
          left_ankle_pitch_joint: 5.
          left_ankle_roll_joint:  5.
          right_hip_pitch_joint:  8.
          right_hip_roll_joint:   8.
          right_hip_yaw_joint:    6.
          right_knee_joint:       8.
          right_ankle_pitch_joint: 5.
          right_ankle_roll_joint: 5.
          # waist
          waist_yaw_joint:   8.
          waist_pitch_joint: 5.
          waist_roll_joint:  5.
          # arm
          left_shoulder_pitch_joint:  2.
          left_shoulder_roll_joint:   2.
          left_shoulder_yaw_joint:    2.
          left_elbow_joint:           2.
          left_wrist_yaw_joint:       2.
          left_wrist_pitch_joint:     2.
          left_wrist_roll_joint:      2.
          right_shoulder_pitch_joint: 2.
          right_shoulder_roll_joint:  2.
          right_shoulder_yaw_joint:   2.
          right_elbow_joint:          2.
          right_wrist_yaw_joint:      2.
          right_wrist_pitch_joint:    2.
          right_wrist_roll_joint:     2.
          # head
          head_yaw_joint:   1.
          head_pitch_joint: 1.

        action_scale: 0.15   # target_pos = action * 0.15 + default_pos
        decimation: 10       # policy runs every 10 physics steps (50 Hz)
        cycle_time: 1.2

      normalization:
        clip_scales:
          clip_observations: 100.
          clip_actions:      100.
        obs_scales:
          lin_vel:             2.0
          ang_vel:             0.2   # from sim2sim: base_ang_vel scale=0.2
          dof_pos:             1.0
          dof_vel:             0.05  # from sim2sim: joint_vel scale=0.05
          quat:                1.0
          projectedG:          1.0
          # height_measurements: 5.0

      size:
        actions_size: 12       # 12 leg joints driven by policy
        observations_size: 45 # 45 per frame × 5 history frames
        observations_type: 0
        num_hist: 5            # history_length = 5

      mode:
        sw_mode: True
        cmd_threshold: 0.05
        "stacking_mode, for observation": term
