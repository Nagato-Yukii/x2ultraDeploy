      enabled: true
      policy_file: policy/DreamWaQ/model.onnx

      observation_size: 106
      history_size: 5
      action_size: 31
      decimation: 10  # 500 Hz controller / 10 = 50 Hz DreamWaQ policy inference

      action_scale: 0.25
      clip_actions: 100.0
      clip_observations: 100.0
      phase_period: 1.0

      # MuJoCo/ROS2 hardware joint order. Observation/action conversion uses
      # X2Ultra_Sim2Sim_Joint_Order_Mapping.md below.
      default_dof_pos:
        - -0.25  # left_hip_pitch_joint
        - -0.01  # left_hip_roll_joint
        - -0.01  # left_hip_yaw_joint
        - 0.45   # left_knee_joint
        - -0.1   # left_ankle_pitch_joint
        - 0.0    # left_ankle_roll_joint
        - -0.25  # right_hip_pitch_joint
        - -0.01  # right_hip_roll_joint
        - -0.01  # right_hip_yaw_joint
        - 0.45   # right_knee_joint
        - -0.1   # right_ankle_pitch_joint
        - 0.0    # right_ankle_roll_joint
        - 0.0    # waist_yaw_joint
        - 0.0    # waist_pitch_joint
        - 0.0    # waist_roll_joint
        - 0.4    # left_shoulder_pitch_joint
        - 0.0    # left_shoulder_roll_joint
        - 0.0    # left_shoulder_yaw_joint
        - -1.2   # left_elbow_joint
        - 0.0    # left_wrist_yaw_joint
        - 0.0    # left_wrist_pitch_joint
        - 0.0    # left_wrist_roll_joint
        - 0.4    # right_shoulder_pitch_joint
        - 0.0    # right_shoulder_roll_joint
        - 0.0    # right_shoulder_yaw_joint
        - -1.2   # right_elbow_joint
        - 0.0    # right_wrist_yaw_joint
        - 0.0    # right_wrist_pitch_joint
        - 0.0    # right_wrist_roll_joint
        - 0.0    # head_yaw_joint
        - 0.0    # head_pitch_joint

